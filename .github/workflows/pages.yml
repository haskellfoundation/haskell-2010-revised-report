name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

# Only one deployment at a time; do not cancel a running one, so that a
# deployment always finishes in a consistent state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: typst-community/setup-typst@v5
      - run: sudo apt-get update && sudo apt-get install -y graphviz
      - run: make pdf html
      - run: mkdir _site
      - run: cp -R haskell-2010-revised.pdf haskell-2010-revised-html _site
      # Generate library report documentation      
      - run: cabal haddock --haddock-output-dir out
        working-directory: stdlib
      - run: mkdir _site/stdlib
      - run: cp stdlib/out/haskell2010-base/* _site/stdlib

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
